{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>口译练习系统</h1>
    <p>本地化、轻量级的口译练习工具</p>
</div>

<div class="grid">
    <div class="card">
        <h2>素材管理</h2>
        <p>上传文本、音频素材，进行切分处理</p>
        <a href="/materials" class="btn">进入管理</a>
    </div>

    <div class="card">
        <h2>开始练习</h2>
        <p>选择素材进行口译练习</p>
        <div id="material-quick-list"></div>
    </div>

    <div class="card">
        <h2>练习记录</h2>
        <p>查看历史练习记录与录音</p>
        <a href="/records" class="btn">查看记录</a>
    </div>

    <div class="card">
        <h2>系统配置</h2>
        <p>配置 ChatGPT API Key 等设置</p>
        <a href="/config" class="btn">配置</a>
    </div>
</div>

<script>
// 加载最近素材
fetch('/api/materials')
    .then(r => r.json())
    .then(materials => {
        const list = document.getElementById('material-quick-list');
        materials.slice(0, 5).forEach(m => {
            const link = document.createElement('a');
            link.href = `/practice/${m.id}`;
            link.textContent = m.title;
            link.className = 'link-item';
            list.appendChild(link);
        });
    });
</script>
{% endblock %}
