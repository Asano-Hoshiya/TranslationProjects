{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>练习记录</h1>
</div>

<div id="records-list"></div>

<script>
async function loadRecords() {
    try {
        const response = await fetch('/api/records');
        const records = await response.json();

        const list = document.getElementById('records-list');
        list.innerHTML = '';

        if (records.length === 0) {
            list.innerHTML = '<div class="card"><p style="color:#666;">暂无练习记录</p></div>';
            return;
        }

        records.forEach(r => {
            const card = document.createElement('div');
            card.className = 'card';

            const date = new Date(r.created_at);
            const dateStr = date.toLocaleString('zh-CN');

            card.innerHTML = `
                <h3>${r.material_title || '未知素材'}</h3>
                <p><strong>练习模式:</strong> ${getModeText(r.mode)} | <strong>时间:</strong> ${dateStr}</p>
                ${r.recording_path ? `
                    <audio controls src="/data/${r.recording_path}" style="width:100%;margin-top:10px;"></audio>
                ` : '<p style="color:#999;">无录音</p>'}
                <div class="btn-group" style="margin-top:1rem;">
                    <button class="btn-sm btn-danger" onclick="deleteRecord(${r.id}, '${r.material_title || '此记录'}')">删除</button>
                </div>
            `;
            list.appendChild(card);
        });
    } catch (error) {
        console.error('加载记录失败:', error);
        alert('加载练习记录失败');
    }
}

function getModeText(mode) {
    const modeMap = {
        'interpreting': '交传听译',
        'consecutive': '顺译',
        'sight': '视译',
        'listening': '听译'
    };
    return modeMap[mode] || mode;
}

async function deleteRecord(id, title) {
    if (!confirm(`确定要删除"${title}"的练习记录吗？\n\n此操作无法恢复！`)) {
        return;
    }

    try {
        const response = await fetch(`/api/records/${id}`, {
            method: 'DELETE'
        });

        if (response.ok) {
            alert('删除成功！');
            loadRecords();
        } else {
            const result = await response.json();
            alert('删除失败: ' + (result.error || '未知错误'));
        }
    } catch (error) {
        alert('删除失败: ' + error.message);
    }
}

loadRecords();
</script>
{% endblock %}
